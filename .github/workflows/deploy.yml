name: Deploy fav-like-ed to Cloudflare Workers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cron_minutes:
        description: "Cron interval in minutes (1-59; 60 for hourly)"
        required: false
        default: "15"
      include_likes:
        description: "Fetch liked posts"
        required: false
        default: "true"
      include_retweets:
        description: "Fetch reposts"
        required: false
        default: "true"
      include_quotes:
        description: "Fetch quote posts"
        required: false
        default: "true"
      github_md_targets:
        description: "Markdown outputs: year, month, full"
        required: false
        default: "year,month,full"
      emdash_site_name:
        description: "EmDash site name used in the Setup EmDash workflow"
        required: false
        default: "fl-ed"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    name: Deploy favo-like Worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install

      - name: Resolve EmDash URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMDASH_SITE_NAME: ${{ github.event.inputs.emdash_site_name || vars.EMDASH_SITE_NAME || 'fl-ed' }}
        run: |
          node -e '
            const fs = require("fs");
            const token = (process.env.CLOUDFLARE_API_TOKEN || "").trim();
            const accountId = (process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
            const siteName = (process.env.EMDASH_SITE_NAME || "").trim();

            async function main() {
              if (!token || !accountId || !siteName) {
                throw new Error("Cloudflare API Token、Account ID、EmDash site name が必要です。");
              }
              if (!/^[a-z0-9-]{1,63}$/.test(siteName)) {
                throw new Error(`無効なEmDash site nameです: ${siteName}`);
              }

              const response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/workers/subdomain`,
                { headers: { Authorization: `Bearer ${token}` } }
              );
              const payload = await response.json();
              const subdomain = payload.result?.subdomain;
              if (!response.ok || !payload.success || !subdomain) {
                throw new Error(`Cloudflare workers.dev サブドメインを取得できませんでした: ${JSON.stringify(payload)}`);
              }
              if (!/^[a-z0-9-]+$/.test(subdomain)) {
                throw new Error("Cloudflare APIから無効なworkers.devサブドメインが返されました。");
              }

              const url = `https://${siteName}.${subdomain}.workers.dev`;
              fs.appendFileSync(process.env.GITHUB_ENV, `EMDASH_URL=${url}\n`);
              console.log(`Resolved EmDash URL: ${url}`);
            }

            main().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          '

      - name: Configure Cron and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_MINUTES_INPUT: ${{ github.event.inputs.cron_minutes || vars.CRON_MINUTES || '15' }}
          INCLUDE_LIKES_INPUT: ${{ github.event.inputs.include_likes || vars.INCLUDE_LIKES || 'true' }}
          INCLUDE_RETWEETS_INPUT: ${{ github.event.inputs.include_retweets || vars.INCLUDE_RETWEETS || 'true' }}
          INCLUDE_QUOTES_INPUT: ${{ github.event.inputs.include_quotes || vars.INCLUDE_QUOTES || 'true' }}
          GITHUB_MD_TARGETS_INPUT: ${{ github.event.inputs.github_md_targets || vars.GH_MD_TARGETS || 'year,month,full' }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = String(process.env.CRON_MINUTES_INPUT || "15").trim();
            let cronExpr = "*/15 * * * *";
            if (raw.includes(" ")) {
              cronExpr = raw;
            } else {
              const mins = parseInt(raw, 10);
              if (mins === 1) {
                cronExpr = "* * * * *";
              } else if (!isNaN(mins) && mins >= 2 && mins <= 59) {
                cronExpr = `*/${mins} * * * *`;
              } else if (mins === 60) {
                cronExpr = "0 * * * *";
              }
            }
            const toml = fs.readFileSync("wrangler.toml", "utf8");
            fs.writeFileSync("wrangler.toml", toml.replace(/crons\s*=\s*\[.*?\]/, `crons = ["${cronExpr}"]`));
            console.log("Configured Cron:", cronExpr);
          '
          npx wrangler deploy \
            --var INCLUDE_LIKES:"$INCLUDE_LIKES_INPUT" \
            --var INCLUDE_RETWEETS:"$INCLUDE_RETWEETS_INPUT" \
            --var INCLUDE_QUOTES:"$INCLUDE_QUOTES_INPUT" \
            --var GITHUB_MD_TARGETS:"$GITHUB_MD_TARGETS_INPUT"

      - name: Sync secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_TOKEN_SECRET: ${{ secrets.GH_SYNC_TOKEN }}
          GITHUB_REPO_SECRET: ${{ secrets.GH_SYNC_REPO || github.repository }}
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          node -e '
            const fs = require("fs");
            const secrets = {};
            const keys = [
              ["X_USERNAME", process.env.X_USERNAME],
              ["X_USER_ID", process.env.X_USER_ID],
              ["X_BEARER_TOKEN", process.env.X_BEARER_TOKEN],
              ["X_API_KEY", process.env.X_API_KEY],
              ["X_API_SECRET", process.env.X_API_SECRET],
              ["X_ACCESS_TOKEN", process.env.X_ACCESS_TOKEN],
              ["X_ACCESS_SECRET", process.env.X_ACCESS_SECRET],
              ["EMDASH_URL", process.env.EMDASH_URL],
              ["GITHUB_TOKEN", process.env.GITHUB_TOKEN_SECRET],
              ["GITHUB_REPO", process.env.GITHUB_TOKEN_SECRET ? process.env.GITHUB_REPO_SECRET : ""],
              ["TRIGGER_SECRET", process.env.TRIGGER_SECRET]
            ];
            for (const [key, value] of keys) {
              if (value && String(value).trim()) secrets[key] = String(value).trim();
            }
            fs.writeFileSync(".cf-secrets.json", JSON.stringify(secrets));
          '
          npx wrangler secret bulk .cf-secrets.json
          rm -f .cf-secrets.json
